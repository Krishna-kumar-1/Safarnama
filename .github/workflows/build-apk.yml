name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Safarnama Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Static Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r static/* android/app/src/main/assets/www/

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Safarnama-v1.0-Debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/Safarnama-v1.0-Release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/Safarnama-v1.0-Release.apk
          fi
          ls -la apk-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Safarnama-Android-APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Safarnama Android APK (Latest)"
          body: |
            ### 📱 Safarnama - Indian Railways Route & Connection Finder (Android APK)
            
            - **Compatibility**: Compatible with **Android 5.0 (Lollipop) up to Android 15** (minSdk 21, targetSdk 34).
            - **All Screen Sizes**: Compact, responsive layout for small budget phones (320px–360px) up to large displays.
            - **Low-End Hardware Optimized**: Ultra-lightweight APK, hardware accelerated Canvas rendering, low memory footprint (<30 MB RAM).
            - **Voice Assistant Ready**: Built-in audio/microphone permissions for Safarnama AI Voice Search ("Bol kar search karein").
            
            #### 📥 Download and Install:
            1. Download `Safarnama-v1.0-Debug.apk` or `Safarnama-v1.0-Release.apk` directly on your Android phone.
            2. Tap the downloaded file and select **Install**. (If prompted, allow *Install from Unknown Sources*).
            3. Enjoy 100% authentic Indian Railways routes and real physical rail track geometry!
          files: apk-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
