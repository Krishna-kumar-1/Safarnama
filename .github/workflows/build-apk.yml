name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Safarnama Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Static Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r static/* android/app/src/main/assets/www/

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Safarnama-v1.0.apk
          fi
          ls -la apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Safarnama-Android-APK
          path: apk-output/Safarnama-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Safarnama Android App v1.0.0"
          body: |
            ### 📱 Safarnama - Indian Railways Route Finder Android App (v1.0.0)

            - **Universal Compatibility**: Android 5.0 (Lollipop) up to Android 15.
            - **All Screen Sizes**: Compact, responsive layout for small budget phones up to large displays.
            - **Low-End Hardware**: Ultra-lightweight APK, hardware accelerated Canvas rendering, low memory footprint (<30 MB RAM).
            - **AI Voice Assistant**: Microphone permission enabled for Hindi/English voice queries ("Bol kar search karein").

            #### 📥 Direct Installation:
            1. Download `Safarnama-v1.0.apk` below directly to your phone.
            2. Tap the file on your Android phone and install! (If prompted, allow *Install from Unknown Sources*).
          files: apk-output/Safarnama-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
